# Foundry casting file — reproducible SigNoz + MCP deployment.
# Hackathon Field Requirement: this file (and casting.yaml.lock) must live in the
# repo so judges can re-run `foundryctl cast -f casting.yaml` to reproduce it.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  mcp:
    spec:
      enabled: true
