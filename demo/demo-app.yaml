---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: foundry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              pip install -q fastapi uvicorn httpx \
                opentelemetry-api opentelemetry-sdk \
                opentelemetry-exporter-otlp-proto-http \
                opentelemetry-instrumentation-fastapi \
                opentelemetry-instrumentation-logging &&
              cd /app && uvicorn app:app --host 0.0.0.0 --port 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: checkout-api
            - name: DEMO_ROLE
              value: checkout
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://OTLP_HOST_PLACEHOLDER:4318"
            - name: DOWNSTREAM_URL
              value: "http://payment-svc:8000"
            - name: ERROR_RATE
              value: "0.25"
            - name: EXTRA_LATENCY_MS
              value: "0"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: code
