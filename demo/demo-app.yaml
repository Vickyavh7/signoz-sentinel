---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: foundry
spec:
  type: ClusterIP
  selector:
    app: checkout-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: checkout-loadgen
  namespace: foundry
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              args:
                - "-s"
                - "-o"
                - "/dev/null"
                - "-w"
                - "%{http_code}"
                - "http://checkout-api:8000/checkout"
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { cpu: "50m", memory: "64Mi" }
